# Load local configuration without requiring an IntelliJ dotenv plugin.
spring.config.import=optional:file:./.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
server.port=${SERVER_PORT:8080}

spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASS:postgres}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dailyreminder}
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Local fallback retained for development; prod requires JWT_SECRET.
jwt.secret=${JWT_SECRET:mysecrety}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.auth.require-verification=${APP_AUTH_REQUIRE_VERIFICATION:false}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@dailyreminder.local}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

server.error.include-stacktrace=never
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.enabled=true
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/scalar
